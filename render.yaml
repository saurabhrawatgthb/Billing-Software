services:
  # 1. Backend Web Service
  - type: web
    name: restaurent-pos-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Static Site
  - type: web
    name: restaurent-pos-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://restaurent-pos-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://restaurent-pos-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
